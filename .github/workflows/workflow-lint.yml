#
# The workflow gates every repository in the noyalib family runs, from
# the core's shared workflows pinned by SHA: actionlint (well-formed),
# zizmor (safe, gating at medium and above) and the single-publisher
# check (nothing here publishes a package).

name: Workflow lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-actionlint.yml@139a826ba273b8f9feffff54795711f4df321928
  zizmor:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-zizmor.yml@139a826ba273b8f9feffff54795711f4df321928
  single-publisher:
    uses: sebastienrousseau/noyalib/.github/workflows/shared-single-publisher.yml@139a826ba273b8f9feffff54795711f4df321928
