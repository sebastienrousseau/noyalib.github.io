#
# Builds noyalib.com and publishes it. Every gate in `make gates` runs before
# the artefact is uploaded, so a page outside the readability band, a broken
# link, a missing sitemap entry or a WCAG 2.2 AA failure stops the deploy.
# Pull requests run the same build and gates without deploying.

name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and gate
    runs-on: ubuntu-latest
    env:
      NOYALIB_REQUIRE_BROWSER: "1"
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Cache the ssg binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/ssg
          key: cargo-ssg-${{ runner.os }}-0.0.56
      - name: Install ssg
        run: command -v ssg || cargo install ssg --version 0.0.56 --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the browser test tooling
        run: npm install --no-save puppeteer-core@23 axe-core@4
      - name: Build the site
        run: make web
      - name: Run every gate
        run: make gates
      - name: Verify the agent discovery files are present
        run: |
          for f in .nojekyll .well-known/mcp.json .well-known/ai-plugin.json mcp.json ai-plugin.json agents.txt 404.html CNAME wasm/noyalib_wasm_bg.wasm; do
            if [ -e "web/public/$f" ]; then echo "ok      $f"; else echo "::error::missing $f"; exit 1; fi
          done
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: web/public

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
