#
# Builds noyalib.com and publishes it. Every gate in `make gates` runs before
# the artefact is uploaded, so a page outside the readability band, a broken
# link, a missing sitemap entry or a WCAG 2.2 AA failure stops the deploy.
# Pull requests run the same build and gates without deploying.

name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and gate
    runs-on: ubuntu-latest
    env:
      NOYALIB_REQUIRE_BROWSER: "1"
      CHROME_PATH: /usr/bin/google-chrome
      # The ssg release this site builds with. The site tracks the
      # latest ssg, so this is bumped the way Dependabot would bump a
      # dependency, as a one-line change; Dependabot itself cannot see
      # a `cargo install` line, so "Report a newer ssg" below warns on
      # every main build once crates.io has a newer release. Until
      # v0.0.55 the job ran `cargo install ssg` unpinned, so the
      # deployed site was built by whatever ssg was newest that minute.
      SSG_VERSION: "0.0.66"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      # Keyed on the pinned version. The old key carried the run id, so
      # it never hit and every run rebuilt ssg anyway.
      - name: Cache the ssg binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/ssg
          key: cargo-ssg-${{ runner.os }}-${{ env.SSG_VERSION }}
      - name: Install ssg ${{ env.SSG_VERSION }}
        run: |
          set -euo pipefail
          have=$(ssg --version 2>/dev/null | awk '{print $2}' || true)
          if [ "$have" != "$SSG_VERSION" ]; then
            cargo install ssg --locked --version "$SSG_VERSION" --force
          fi
          [ "$(ssg --version | awk '{print $2}')" = "$SSG_VERSION" ] \
            || { echo "::error::ssg is not ${SSG_VERSION}"; exit 1; }
      - name: Report a newer ssg
        if: github.event_name != 'pull_request'
        run: |
          latest=$(curl -fsS --max-time 20 \
            -A 'noyalib.com CI (https://github.com/sebastienrousseau/noyalib.github.io)' \
            https://crates.io/api/v1/crates/ssg | jq -r '.crate.max_stable_version') || exit 0
          if [ -n "$latest" ] && [ "$latest" != "$SSG_VERSION" ]; then
            echo "::warning::ssg ${latest} is on crates.io; pages.yml builds with ${SSG_VERSION}. Bump SSG_VERSION."
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Exact versions from the committed package-lock.json, with npm
      # lifecycle scripts off. It was `npm install --no-save
      # puppeteer-core@23 axe-core@4`: unpinned, unlocked, scripts on, in
      # the job that builds the deployed artefact.
      - name: Install the browser test tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the site
        run: make web
      - name: Run every gate
        run: make gates
      - name: Verify the agent discovery files are present
        run: |
          for f in .nojekyll .well-known/mcp.json .well-known/ai-plugin.json mcp.json ai-plugin.json agents.txt 404.html CNAME wasm/noyalib_wasm_bg.wasm; do
            if [ -e "web/public/$f" ]; then echo "ok      $f"; else echo "::error::missing $f"; exit 1; fi
          done
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: web/public
          # v4+ drops dot-paths by default; the agent discovery manifests
          # live under .well-known/ and .nojekyll must ship too.
          include-hidden-files: true
      - name: Verify the artifact carries the discovery files
        if: github.event_name != 'pull_request'
        run: |
          for f in ./.nojekyll ./.well-known/mcp.json ./.well-known/ai-plugin.json ./mcp.json ./agents.txt; do
            if tar -tf "$RUNNER_TEMP/artifact.tar" | grep -qxF "$f"; then echo "ok      $f"; else echo "::error::artifact is missing $f"; exit 1; fi
          done

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
