#
# Keeps the deploy and quality-gate workflows' pinned actions current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - dependencies
      - github_actions
    groups:
      actions:
        patterns:
          - "actions/*"
